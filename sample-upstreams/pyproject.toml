[project]
name = "sample-upstreams"
version = "0.1.0"
description = "Two tiny FastMCP 4.1 servers used by the local stack and e2e tests."
requires-python = ">=3.12"
dependencies = ["fastmcp==4.1.0"]

[project.scripts]
sample-public = "sample_upstreams.sample_public:main"
sample-private = "sample_upstreams.sample_private:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_upstreams"]
