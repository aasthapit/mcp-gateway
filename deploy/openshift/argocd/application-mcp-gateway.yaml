# Argo CD (OpenShift GitOps) Application for the gateway chart in prod. One Application per
# chart per environment; applicationset.yaml generates all of them from a list.
#   oc apply -n openshift-gitops -f deploy/openshift/argocd/application-mcp-gateway.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-gateway-prod
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: mcp-gateway
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aasthapit/mcp-gateway.git
    targetRevision: main
    path: deploy/helm/mcp-gateway
    helm:
      releaseName: mcp-gateway
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # The HPA owns .spec.replicas once autoscaling is on.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
