# DEV ONLY. Plain Secret with the application user passwords referenced by the
# PerconaServerMongoDB CR (spec.users[].passwordSecretRef). Prod uses
# app-users-externalsecret.yaml instead. Generate values with: openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: mcp-mongo-app-users
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: mcp-gateway
type: Opaque
stringData:
  gateway-password: CHANGE-ME
  admin-api-password: CHANGE-ME
