# Percona Operator for MongoDB from OperatorHub (Red Hat Certified catalog), namespace-scoped
# install into mcp-gateway. Apply with cluster-admin, then wait for the CSV to be Succeeded:
#   oc apply -f deploy/openshift/mongodb/operator-subscription.yaml
#   oc get csv -n mcp-gateway -w
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: mcp-gateway-operators
  namespace: mcp-gateway
spec:
  targetNamespaces:
    - mcp-gateway
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: percona-server-mongodb-operator
  namespace: mcp-gateway
spec:
  channel: stable
  name: percona-server-mongodb-operator-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
  # Manual: operator upgrades are a change you review (the CR pins crVersion anyway).
  installPlanApproval: Manual
  startingCSV: percona-server-mongodb-operator-certified.v1.23.1
