# Prod: application user passwords and backup credentials from the secret manager through
# the External Secrets Operator (ClusterSecretStore `vault-backend`, see deploy/README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-mongo-app-users
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: mcp-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-mongo-app-users
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: gateway-password
      remoteRef: { key: mcp-gateway/mongo-users, property: gateway-password }
    - secretKey: admin-api-password
      remoteRef: { key: mcp-gateway/mongo-users, property: admin-api-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-mongo-backup-s3
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: mcp-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-mongo-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: mcp-gateway/mongo-backup, property: access-key-id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: mcp-gateway/mongo-backup, property: secret-access-key }
