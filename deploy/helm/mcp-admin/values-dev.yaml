api:
  image: { tag: dev, pullPolicy: Always }
  replicaCount: 1
  env:
    ADMIN_ENV: dev
    ADMIN_OIDC_ISSUER: https://keycloak-dev.apps.example.com/realms/mcp
    ADMIN_LOG_LEVEL: debug
  podDisruptionBudget: { enabled: false }
ui:
  image: { tag: dev, pullPolicy: Always }
  replicaCount: 1
  env:
    ADMIN_UI_OIDC_AUTHORITY: https://keycloak-dev.apps.example.com/realms/mcp
    ADMIN_UI_GATEWAY_MCP_URL: https://mcp-dev.apps.example.com/mcp
    ADMIN_UI_ENVIRONMENT: dev
  podDisruptionBudget: { enabled: false }
externalSecrets:
  enabled: false
secrets:
  create: true
  values:
    mongoUri: mongodb://admin-api:CHANGE-ME@mcp-mongo-rs0.mcp-gateway.svc.cluster.local:27017/mcp_gateway?replicaSet=rs0&tls=true&tlsCAFile=/etc/admin/mongo-ca/ca.crt
# One explicit host: UI and API must share it (the UI calls /api same-origin), and two
# router-generated hosts would differ.
route:
  host: mcp-admin-dev.apps.example.com
networkPolicy:
  egress:
    https:
      ipBlocks: [{ cidr: 0.0.0.0/0 }]
