{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "mcp-admin.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-admin.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "mcp-admin.envSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- toYaml .Values.externalSecrets.data | nindent 4 }}
{{- end }}
