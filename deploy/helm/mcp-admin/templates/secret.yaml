{{- if .Values.secrets.create }}
{{- if .Values.externalSecrets.enabled }}
{{- fail "secrets.create and externalSecrets.enabled are mutually exclusive" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-admin.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-admin.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_MONGO_URI: {{ required "secrets.values.mongoUri" .Values.secrets.values.mongoUri | quote }}
{{- end }}
