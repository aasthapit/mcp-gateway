{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- range $component := list "api" "ui" }}
{{- $c := index $.Values $component }}
{{- if $c.enabled }}
{{- $sel := dict "ctx" $ "component" $component }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-admin.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mcp-admin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-admin.selectorLabels" $sel | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml $np.ingress.router.namespaceSelector | nindent 12 }}
        {{- with $np.ingress.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ $c.port }}
          protocol: TCP
  egress:
    {{- if $np.egress.dns.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml $np.egress.dns.namespaceSelector | nindent 12 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 5353, protocol: UDP }
        - { port: 5353, protocol: TCP }
    {{- end }}
    {{- if eq $component "api" }}
    {{- if $np.egress.mongo.enabled }}
    - to:
        {{- if $np.egress.mongo.ipBlocks }}
        {{- range $np.egress.mongo.ipBlocks }}
        - ipBlock:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- else }}
        - podSelector:
            {{- toYaml $np.egress.mongo.podSelector | nindent 12 }}
          {{- with $np.egress.mongo.namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        - port: {{ $np.egress.mongo.port }}
          protocol: TCP
    {{- end }}
    {{- if $np.egress.gateway.enabled }}
    - to:
        - podSelector:
            {{- toYaml $np.egress.gateway.podSelector | nindent 12 }}
          {{- with $np.egress.gateway.namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - port: {{ $np.egress.gateway.port }}
          protocol: TCP
    {{- end }}
    {{- if $np.egress.https.enabled }}
    - to:
        {{- range $np.egress.https.ipBlocks }}
        - ipBlock:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: {{ $np.egress.https.port }}
          protocol: TCP
    {{- end }}
    {{- with $np.egress.extraTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
