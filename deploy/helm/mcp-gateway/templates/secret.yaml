{{- /*
DEV ONLY plain-Secret fallback. Prod uses externalsecret.yaml (ESO) or pre-existing Secrets.
*/}}
{{- if .Values.secrets.create }}
{{- if .Values.externalSecrets.enabled }}
{{- fail "secrets.create and externalSecrets.enabled are mutually exclusive" }}
{{- end }}
{{- if eq (toString .Values.config.ENV) "prod" }}
{{- fail "secrets.create renders credentials from values; not allowed with config.ENV=prod" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-gateway.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_MONGO_URI: {{ required "secrets.values.mongoUri is required when secrets.create=true" .Values.secrets.values.mongoUri | quote }}
  GATEWAY_INTERNAL_TOKEN: {{ required "secrets.values.internalToken is required when secrets.create=true" .Values.secrets.values.internalToken | quote }}
{{- if .Values.secrets.upstreams.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-gateway.upstreamsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $file, $content := .Values.secrets.values.upstreams }}
  {{ $file }}: {{ $content | quote }}
  {{- end }}
{{- end }}
{{- end }}
