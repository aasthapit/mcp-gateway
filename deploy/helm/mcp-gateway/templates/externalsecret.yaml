{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "mcp-gateway.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "mcp-gateway.envSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- toYaml .Values.externalSecrets.env.data | nindent 4 }}
{{- if .Values.secrets.upstreams.enabled }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "mcp-gateway.upstreamsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "mcp-gateway.upstreamsSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    {{- toYaml .Values.externalSecrets.upstreams.dataFrom | nindent 4 }}
{{- end }}
{{- end }}
