name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff, prettier, hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pre-commit
        run: pip install pre-commit==4.7.0
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  schemas:
    name: schemas (build validators, validate seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema==4.26.0
      - name: Generated validators are up to date and seed documents validate
        run: python schemas/build-mongo-validators.py --check --validate-seed
      - name: validators.js parses
        run: node --check local/mongo-init/validators.js

  admin:
    name: admin-api + admin-ui (typecheck, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin-api/package-lock.json
            admin-ui/package-lock.json
      - name: admin-api
        working-directory: admin-api
        # The live suites (Mongo/Keycloak/gateway) skip themselves without the local stack.
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: admin-ui
        working-directory: admin-ui
        run: npm ci && npm test && npm run build

  gateway-unit:
    name: gateway unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: gateway/uv.lock
      - name: uv sync
        run: uv sync --frozen
      - name: pytest (unit; integration and drills need the stack)
        run: uv run --frozen pytest -m "not integration and not drill"
      - name: Build sdist + wheel and import the installed wheel
        run: |
          set -euo pipefail
          uv build
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -c 'import mcp_gateway.main; print("import ok")'

  gateway-integration:
    name: gateway integration tests (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The runner image ships podman too; the Makefile would pick it, but the stack runs on Docker.
      COMPOSE: docker compose
      CONTAINER: docker
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: gateway/uv.lock
      - uses: docker/setup-buildx-action@v3
      - name: Build the sample upstream image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: sample-upstreams
          file: sample-upstreams/Containerfile
          tags: localhost/mcp-sample-upstreams:dev
          load: true
          cache-from: type=gha,scope=sample-upstreams
          cache-to: type=gha,mode=max,scope=sample-upstreams
      - name: uv sync (in parallel with image pulls)
        working-directory: gateway
        run: |
          docker compose -f ../local/compose.yaml pull mongo keycloak &
          uv sync --frozen
          wait
      - name: Pre-create the Keycloak volume owned by the keycloak user
        # compose mounts keycloak-data at /opt/keycloak/data/h2, which the image lacks, so
        # Docker creates it root-owned and Keycloak (uid 1000) cannot write H2 (rootless
        # podman maps it to the user instead).
        run: |
          docker volume create --label com.docker.compose.project=mcp-gateway \
            --label com.docker.compose.volume=keycloak-data mcp-gateway_keycloak-data
          docker run --rm -v mcp-gateway_keycloak-data:/d --entrypoint chown docker.io/library/mongo:8 1000:0 /d
      - name: make up (mongo rs PRIMARY + validators, keycloak realm import + OIDC discovery)
        # The image is already built and loaded above; `up --build` reuses its cached layers.
        run: make up COMPOSE="$COMPOSE"
      - name: make seed
        run: make seed COMPOSE="$COMPOSE"
      - name: Readiness (local/smoke.sh - rs.status PRIMARY, seeded meta.version, tokens, upstreams)
        run: local/smoke.sh
      - name: Route the podman CLI to docker (upstream stop/start tests)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec docker "$@"\n' > "$RUNNER_TEMP/bin/podman"
          chmod +x "$RUNNER_TEMP/bin/podman"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: pytest -m integration
        working-directory: gateway
        run: |
          set -o pipefail
          uv run --frozen pytest -m integration -rs -v | tee "$RUNNER_TEMP/pytest.log"
          # The live suites skip themselves when the stack is unreachable; here that is a failure.
          if grep -E '^SKIPPED' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::integration tests skipped although the stack is up"; exit 1
          fi
      - name: Gateway smoke (in-process gateway, guest + dev1 + live allow-list change)
        run: |
          set -euo pipefail
          tok=$(make -s token KC_USER=dev1)
          cd gateway && GATEWAY_SMOKE_TOKEN="$tok" uv run --frozen python -m mcp_gateway.smoke
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f local/compose.yaml --env-file local/.env logs --no-color --tail 200

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose -f local/compose.yaml config -q

  deploy-check:
    name: deploy (helm lint/template, kubeconform, conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Install kubeconform and conftest
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin conftest
          kubeconform -v && conftest --version
      - name: Install PyYAML (CRD -> JSON schema conversion)
        run: pip install pyyaml==6.0.3
      - name: Cache CRD schemas
        uses: actions/cache@v4
        with:
          path: deploy/kubeconform/cache
          key: crd-schemas-${{ hashFiles('deploy/kubeconform/fetch-schemas.sh') }}
      - name: make deploy-check
        run: make deploy-check
