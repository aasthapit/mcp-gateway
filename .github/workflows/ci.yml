name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff, prettier, hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pre-commit
        run: pip install pre-commit==4.7.0
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  schemas:
    name: schemas (build validators, validate seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema==4.26.0
      - name: Generated validators are up to date and seed documents validate
        run: python schemas/build-mongo-validators.py --check --validate-seed
      - name: validators.js parses
        run: node --check local/mongo-init/validators.js

  admin:
    name: admin-api + admin-ui (typecheck, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin-api/package-lock.json
            admin-ui/package-lock.json
      - name: admin-api
        working-directory: admin-api
        # The live suites (Mongo/Keycloak/gateway) skip themselves without the local stack.
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: admin-ui
        working-directory: admin-ui
        run: npm ci && npm test && npm run build

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose -f local/compose.yaml config -q

  deploy-check:
    name: deploy (helm lint/template, kubeconform, conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Install kubeconform and conftest
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin conftest
          kubeconform -v && conftest --version
      - name: Install PyYAML (CRD -> JSON schema conversion)
        run: pip install pyyaml==6.0.3
      - name: Cache CRD schemas
        uses: actions/cache@v4
        with:
          path: deploy/kubeconform/cache
          key: crd-schemas-${{ hashFiles('deploy/kubeconform/fetch-schemas.sh') }}
      - name: make deploy-check
        run: make deploy-check
