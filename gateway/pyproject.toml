[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Enterprise MCP gateway: one streamable-HTTP endpoint proxying many upstream MCP servers with per-caller tool allow-lists."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.1.*",
    "pydantic-settings>=2.10",
    "uvicorn>=0.35",
    "prometheus-client>=0.22",
    "structlog>=25.1",
]

[project.scripts]
mcp-gateway = "mcp_gateway.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs the local stack (make up)"]

[tool.ruff]
extend = "../ruff.toml"
